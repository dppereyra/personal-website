# SonarQube Project Configuration
sonar.projectKey=dppereyra_personal-website
sonar.projectName=Personal Website
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.js,src/**/*.spec.ts,src/**/*.spec.js

# Exclude files from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.config.*,**/coverage/**,**/.astro/**
sonar.test.exclusions=src/**/*.test.ts,src/**/*.test.js,src/**/*.spec.ts,src/**/*.spec.js

# Coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.js,src/**/*.spec.ts,src/**/*.spec.js,src/env.d.ts

# Language settings
sonar.language=js,ts

# Source encoding
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript specific settings
sonar.typescript.tsconfigPath=tsconfig.json
