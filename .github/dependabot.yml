version: 2
updates:
  # Monitor npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Bundle only patch/minor bumps, which are low-risk. Major bumps are left
    # ungrouped so each opens its own PR instead of blocking the whole batch
    # when one major turns out to be breaking (e.g. a peer-dependency conflict).
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @astrojs/check currently only supports typescript ^5.0.0 || ^6.0.0;
      # typescript 7.x breaks `npm ci` with an ERESOLVE conflict. Revisit once
      # @astrojs/check adds typescript 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
